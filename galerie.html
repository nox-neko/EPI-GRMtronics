        /* Style pour la visionneuse photo (Lightbox) */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .lightbox-modal img {
            max-width: 90%;
            max-height: 85%;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }
    </style>
